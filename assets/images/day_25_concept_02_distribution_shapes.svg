<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="100%" height="100%" rx="28" fill="#F8FAFC"/>
<text x="48" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Distribution shapes and outliers</text>
<text x="48" y="112" font-family="Arial,sans-serif" font-size="21" fill="#475569">Compare the shape of a distribution before interpreting the average.</text>
<rect x="48" y="190" width="259.5" height="205" rx="22" fill="#DCEBFF" stroke="#CBD5E1" stroke-width="2"/><text x="177.75" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">SYMMETRIC</text><text x="177.75" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Mean ≈ median</text><text x="177.75" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">balanced tails</text><path d="M 311.5 292 h 10 m -9 -9 l 9 9 l -9 9" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="329.5" y="190" width="259.5" height="205" rx="22" fill="#E8E1FF" stroke="#CBD5E1" stroke-width="2"/><text x="459.25" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">RIGHT-SKEWED</text><text x="459.25" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Long right tail</text><text x="459.25" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">mean often higher</text><path d="M 593 292 h 10 m -9 -9 l 9 9 l -9 9" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="611" y="190" width="259.5" height="205" rx="22" fill="#DDF5EA" stroke="#CBD5E1" stroke-width="2"/><text x="740.75" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">LEFT-SKEWED</text><text x="740.75" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Long left tail</text><text x="740.75" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">mean often lower</text><path d="M 874.5 292 h 10 m -9 -9 l 9 9 l -9 9" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="892.5" y="190" width="259.5" height="205" rx="22" fill="#FFF0D8" stroke="#CBD5E1" stroke-width="2"/><text x="1022.25" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">OUTLIERS</text><text x="1022.25" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Unusual values</text><text x="1022.25" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">investigate context</text>
<text x="48" y="468" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#64748B">BUSINESS ANALYST STUDY NOTES</text>
</svg>